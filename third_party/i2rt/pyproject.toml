[build-system]
requires = ["flit_core >= 3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "i2rt"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["description"]
dependencies = [
    "click<8.2.0",
    "dm-env==1.6",
    "dynamixel-sdk==4.0.5",
    "evdev==1.9.2 ; sys_platform == 'linux'",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.10.9",
    "mink==1.1.1",
    "mujoco==3.8.1",
    "numpy==2.2.6",
    "opencv-python-headless==4.13.0.92",
    "packaging==26.0",
    "pandas==2.3.3",
    "pillow==12.2.0",
    "pin==3.9.0",
    "pin-pink==4.2.0",
    "portal==3.7.3",
    "pyarrow==24.0.0",
    "pyrealsense2==2.57.7.10387 ; sys_platform == 'linux'",
    "pygame==2.6.1",
    "python-can==4.5.0",
    "qpsolvers[daqp,quadprog]==4.12.0",
    "ruckig==0.15.3",
    "scipy==1.15.3",
    "threadpoolctl==3.6.0",
    "tyro==0.9.26",
    "vuer==0.1.6",
    "lerobot",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "ruff==0.15.14",
]
spacemouse = [
    "pyspacemouse",
]
vla = [
    "diffusers==0.37.1",
    "gymnasium==0.29.1",
    "rerun-sdk==0.31.3",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "wandb==0.26.0",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }

[tool.flit.module]
name = "i2rt"

[tool.ruff]
line-length = 119 # Set the max line length to 119 characters.
lint.select = [
    "ANN", # Annotations.
    "B",   # bugbear rules
    # "D",   # docstring rules.
    "E",   # pycodestyle errors.
    "F",   # Pyflakes rules.
    "I",   # Import sorting.
    "PLC", # Pylint convention warnings.
    "PLE", # Pylint errors.
    "PLR", # Pylint refactor recommendations.
    "PLW", # Pylint warnings.
    "RUF"  # Ruff rules.
]
lint.ignore = [
    "ANN101",
    "ANN102",
    "ANN204",
    "ANN401",
    "E741", # Ambiguous variable name. (l, O, or I)
    "F841",
    "E402",
    "E501",
    "PLR1722",
    "PLR2004",  # Magic value used in comparison.
    "PLR0915",  # Too many statements.
    "PLR0913",  # Too many arguments.
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901",  # Use falsey strings.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLW0603",  # Global statement updates are discouraged.
    "PLW2901",  # For loop variable overwritten.
    "RUF005",
    "RUF009",
    "RUF012"
]
lint.extend-select = ["E501"]
lint.exclude = ["*.ipynb"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["scripts/"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]
omit = [
    "*exceptions.py",
]
